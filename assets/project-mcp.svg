<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="100%" stop-color="#141a2b"/>
    </linearGradient>
    <linearGradient id="mcpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="gridPattern4" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad4)"/>
  <rect width="800" height="450" fill="url(#gridPattern4)"/>

  <!-- Architecture Flow -->
  <!-- Node 1: AI / Client -->
  <g transform="translate(60, 160)">
    <rect width="180" height="130" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="15" y="15" width="24" height="24" rx="6" fill="rgba(59, 130, 246, 0.2)"/>
    <text x="27" y="32" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">AI</text>
    <text x="50" y="32" fill="#f8fafc" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="700">Host / LLM</text>
    <text x="15" y="70" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">JSON-RPC / SSE</text>
    <rect x="15" y="85" width="110" height="22" rx="4" fill="rgba(255,255,255,0.05)"/>
    <text x="22" y="100" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10">tools/call</text>
  </g>

  <!-- Connect line 1 -->
  <path d="M 240,225 L 300,225" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="300,221 310,225 300,229" fill="#38bdf8"/>

  <!-- Node 2: MCP Server (Center piece) -->
  <g transform="translate(310, 135)">
    <rect width="200" height="180" rx="12" fill="#131b2e" stroke="url(#mcpGrad)" stroke-width="2" filter="drop-shadow(0 10px 25px rgba(99, 102, 241, 0.2))"/>
    <rect x="20" y="18" width="160" height="26" rx="6" fill="rgba(99, 102, 241, 0.2)"/>
    <text x="100" y="36" fill="#a5b4fc" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="middle">MCP DEBUG SERVER</text>
    
    <text x="20" y="75" fill="#f1f5f9" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600">Protocol Handler</text>
    <text x="20" y="95" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">• DOM Inspection</text>
    <text x="20" y="115" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">• Network Telemetry</text>
    <text x="20" y="135" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">• Console Capture</text>
    <text x="20" y="155" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">• Visual Snapshots</text>
  </g>

  <!-- Connect line 2 -->
  <path d="M 510,225 L 560,225" stroke="#818cf8" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="560,221 570,225 560,229" fill="#818cf8"/>

  <!-- Node 3: Headless Playwright Browser -->
  <g transform="translate(570, 150)">
    <rect width="170" height="150" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="25" cy="22" r="5" fill="#ef4444"/>
    <circle cx="39" cy="22" r="5" fill="#f59e0b"/>
    <circle cx="53" cy="22" r="5" fill="#10b981"/>
    <text x="70" y="26" fill="#6ee7b7" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700">Playwright</text>

    <!-- Mini web browser representation -->
    <rect x="15" y="45" width="140" height="85" rx="6" fill="#070b13" stroke="rgba(255,255,255,0.06)"/>
    <rect x="25" y="55" width="60" height="8" rx="2" fill="#334155"/>
    <rect x="25" y="70" width="120" height="5" rx="2" fill="#1e293b"/>
    <rect x="25" y="80" width="100" height="5" rx="2" fill="#1e293b"/>
    <rect x="25" y="95" width="40" height="18" rx="3" fill="#10b981" opacity="0.6"/>
  </g>

  <!-- Badge Top -->
  <rect x="30" y="30" width="260" height="34" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.1)"/>
  <circle cx="48" cy="47" r="5" fill="#10b981"/>
  <text x="64" y="52" fill="#e2e8f0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600">Model Context Protocol • Playwright</text>

  <text x="400" y="415" fill="#64748b" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" text-anchor="middle">Agentic Browser Automation &amp; Diagnostics Engine via MCP</text>
</svg>
